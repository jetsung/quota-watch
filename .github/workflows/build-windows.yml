name: Build Windows (artifact only)

# 轻量 Windows 构建：仅手动触发，只产出 x86_64 MSVC 可执行文件 zip，
# 不构建其他平台、不发布 release。用于按需获取 Windows 版本。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '构建的分支（留空则使用默认分支）'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_DIR: dist

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Update Rust
        run: |
          rustup update
          rustc --version
      - name: Install zip utility
        run: choco install zip -y
        shell: powershell
      - name: Install target for Windows
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Build for Windows (x86_64)
        shell: bash
        run: cargo build -p quota-watch --release --target x86_64-pc-windows-msvc
      - name: Assert GUI subsystem (no console)
        # release 产物必须是 Windows GUI 子系统（PE Subsystem == 2），否则双击会弹 Console。
        # 读 PE 头：e_lfanew(偏移60) → OptionalHeader(PE32+ 偏移68 处为 Subsystem)。
        shell: powershell
        run: |
          $b = [IO.File]::ReadAllBytes('target/x86_64-pc-windows-msvc/release/quota-watch.exe')
          $pe = [BitConverter]::ToInt32($b, 60)
          Write-Host "e_lfanew = $pe"
          Write-Host "PE signature = $([System.Text.Encoding]::ASCII.GetString($b[$pe..($pe+3)]))"
          $magic = [BitConverter]::ToUInt16($b, $pe + 24)
          Write-Host ("Optional Header Magic = 0x{0:X} ({1})" -f $magic, $(if ($magic -eq 0x20B) { 'PE32+' } elseif ($magic -eq 0x10B) { 'PE32' } else { 'Unknown' }))
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          Write-Host "Subsystem = $sub (2=GUI, 3=Console)"
          # dump full Optional Header for diagnosis
          Write-Host "--- Optional Header first 80 bytes (hex) ---"
          $oh = $b[($pe + 24)..($pe + 24 + 79)]
          $hex = ($oh | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          Write-Host $hex
          if ($sub -ne 2) { Write-Host "::warning::Subsystem is $sub, expected 2 (GUI)" }
      - name: Create release zip
        shell: bash
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          mkdir "${{ env.RELEASE_DIR }}"
          zip -j "${{ env.RELEASE_DIR }}/quota-watch-v${VER}-x86_64-pc-windows-msvc.zip" target/x86_64-pc-windows-msvc/release/quota-watch.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: ${{ env.RELEASE_DIR }}/*
          retention-days: 30
