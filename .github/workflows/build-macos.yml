name: Build macOS (artifact only)

# 轻量 macOS 构建：仅手动触发，产出 x86_64 与 aarch64 可执行文件 tarball
# 与未签名的 .app（Universal）tarball，不发布 release。
# 本项目无 Apple Developer 账号，不执行签名公证（Gatekeeper 警告的放行方式见 README）。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '构建的分支（留空则使用默认分支）'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_DIR: dist
  APP_NAME: QuotaWatch
  BUNDLE_ID: cn.gcli.quota-watch

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: true
      - name: Update Rust
        run: |
          rustup update
          rustc --version
      - name: Install targets for MacOS
        run: |
          for arch in x86_64 aarch64; do
            rustup target add $arch-apple-darwin
          done
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-macos-
      - name: Build for MacOS
        run: |
          for arch in x86_64 aarch64; do
            cargo build -p quota-watch --release --target $arch-apple-darwin
          done
          # 合并为单个 Universal Binary（供 .app 打包使用）
          lipo -create \
            target/aarch64-apple-darwin/release/quota-watch \
            target/x86_64-apple-darwin/release/quota-watch \
            -output quota-watch
          lipo -info quota-watch
      - name: Extract version
        id: ver
        run: echo "VER=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Assemble .app bundle
        run: |
          APP_DIR="${{ env.APP_NAME }}.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          cp quota-watch "$APP_DIR/Contents/MacOS/quota-watch"

          # PNG 生成 icns 图标
          ICONSET=quota-watch.iconset
          mkdir "$ICONSET"
          SRC=assets/icons/quota-watch-256.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/quota-watch.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>${{ env.APP_NAME }}</string>
            <key>CFBundleDisplayName</key>       <string>Quota Watch</string>
            <key>CFBundleIdentifier</key>        <string>${{ env.BUNDLE_ID }}</string>
            <key>CFBundleVersion</key>           <string>${{ steps.ver.outputs.VER }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.ver.outputs.VER }}</string>
            <key>CFBundleExecutable</key>        <string>quota-watch</string>
            <key>CFBundleIconFile</key>          <string>quota-watch</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>LSMinimumSystemVersion</key>    <string>10.15</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>NSHumanReadableCopyright</key>  <string>Apache-2.0</string>
          </dict>
          </plist>
          PLIST
      - name: Create tarballs
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          mkdir -p "${{ env.RELEASE_DIR }}"
          for arch in x86_64 aarch64; do
            tar -cJf "${{ env.RELEASE_DIR }}/quota-watch-v${VER}-${arch}-apple-darwin.tar.xz" -C target/$arch-apple-darwin/release quota-watch
          done
          # 未签名的 .app（Universal）；文件名不含 signed，作为未签名信号。
          # 不含 apple-darwin 与单 arch 关键词，不会被应用内自更新选中（见 src/update.rs）
          tar -cJf "${{ env.RELEASE_DIR }}/quota-watch-v${VER}-universal.app.tar.xz" "${{ env.APP_NAME }}.app"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ env.RELEASE_DIR }}/*
          retention-days: 30
