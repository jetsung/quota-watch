name: Build Prerelease (Linux)

on:
  push:
    tags:
      - 'v*-preview*'
      - 'v*-alpha*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要补发资产的已有 tag（如 v0.1.0-rc1），留空则使用当前分支/引用'
        required: false
        type: string

permissions:
  contents: write

# 同一 tag 重复推送不取消进行中的构建（发布 release 不可逆）
concurrency:
  group: release-prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_DIR: dist

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.tag.outputs.TAG_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - name: Install system dependencies
        # GPUI Linux 依赖：zed-font-kit/freetype-sys 构建脚本经 pkg-config 查找
        # fontconfig/freetype2；xkbcommon 以 #[link] 链接，需要开发符号链接
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Extract tag name
        id: tag
        run: |
          TAG="${{ inputs.tag_name || github.ref }}"
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Update Rust
        run: |
          rustup update
          rustc --version
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-linux-
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Build for Linux (x86_64-gnu)
        run: |
          cargo build -p quota-watch --release --target x86_64-unknown-linux-gnu
      - name: Package .deb, .rpm and tarball
        run: |
          mkdir ${{ env.RELEASE_DIR }}
          # .deb
          cargo deb --target x86_64-unknown-linux-gnu --no-build --no-strip
          mv target/x86_64-unknown-linux-gnu/debian/*.deb ${{ env.RELEASE_DIR }}/
          # .rpm
          cargo generate-rpm --target x86_64-unknown-linux-gnu
          mv target/x86_64-unknown-linux-gnu/generate-rpm/*.rpm ${{ env.RELEASE_DIR }}/
          # tarball
          tar -cJf "${{ env.RELEASE_DIR }}/quota-watch-v${{ steps.tag.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.xz" -C target/x86_64-unknown-linux-gnu/release quota-watch
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: ${{ env.RELEASE_DIR }}/*
          retention-days: 1

  create-release:
    needs: [build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-dist/
          pattern: packages-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd all-dist
          sha256sum -- * | sort -k2 > SHA256SUMS.txt
      - name: Create Release
        # tag push 触发时 inputs.tag_name 为空，取 build-linux 解析出的 tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-linux.outputs.tag_name || inputs.tag_name }}
          files: all-dist/*
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
