name: Build Release

on:
  push:
    tags:
      # 仅匹配正式版标签 vX.Y.Z（如 v1.0.0、v10.20.30），排除预发布版本（如 v1.0.0-alpha、v1.0.0-rc1）
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v[0-9]*.[0-9]*.[0-9]*-*'
      # 支持 beta 版（如 v1.0.0-beta、v1.0.0-beta.1）
      - 'v[0-9]*.[0-9]*.[0-9]*-beta*'
      - 'v[0-9]*.[0-9]*.[0-9]*-rc*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要补发资产的已有 tag（如 v1.0.0），留空则使用当前分支/引用'
        required: false
        type: string

permissions:
  contents: write

# 同一 tag 重复推送不取消进行中的构建（发布 release 不可逆）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_DIR: dist

jobs:
  extract-version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.TAG_NAME }}
      version: ${{ steps.tag.outputs.VERSION }}
    steps:
      - name: Extract tag name
        id: tag
        run: |
          TAG="${{ inputs.tag_name || github.ref }}"
          TAG="${TAG#refs/tags/}"
          # 校验 tag 格式（vX.Y.Z，可选 -beta[N] 后缀），
          # 防止手动触发时留空用分支名当版本号建出错误 release
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "::error::tag '$TAG' 不符合 v[X.Y.Z]（或 v[X.Y.Z-beta[N]）格式，已中止"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build-linux:
    needs: [extract-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.extract-version.outputs.tag }}
          submodules: true
      - name: Install system dependencies
        # GPUI Linux 依赖：zed-font-kit/freetype-sys 构建脚本经 pkg-config 查找
        # fontconfig/freetype2；xkbcommon 以 #[link] 链接，需要开发符号链接
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Update Rust
        run: |
          rustup update
          rustc --version
      - name: Install target for Linux
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-linux-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-linux-${{ matrix.arch }}-
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Build for Linux
        run: |
          # GUI 应用依赖系统 wayland/x11/GPU 库，只构建 gnu（glibc）二进制，
          # musl 静态链接对 GUI 无意义
          cargo build -p quota-watch --release --target ${{ matrix.target }}
      - name: Package .deb, .rpm and tarball
        run: |
          mkdir -p "${{ env.RELEASE_DIR }}"
          # .deb (gnu)
          cargo deb --target ${{ matrix.target }} --no-build --no-strip
          mv target/${{ matrix.target }}/debian/*.deb ${{ env.RELEASE_DIR }}/

          # .rpm (gnu) — cargo-generate-rpm emits the .rpm under
          # target/$arch-unknown-linux-gnu/generate-rpm/, so locate it with find
          cargo generate-rpm --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/generate-rpm/*.rpm ${{ env.RELEASE_DIR }}/

          # tarball (gnu)
          tar -cJf "${{ env.RELEASE_DIR }}/quota-watch-v${{ needs.extract-version.outputs.version }}-${{ matrix.target }}.tar.xz" -C target/${{ matrix.target }}/release quota-watch
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.arch }}
          path: ${{ env.RELEASE_DIR }}/*
          retention-days: 1

  build-macos:
    needs: [extract-version]
    runs-on: macos-26
    env:
      APP_NAME: QuotaWatch
      BUNDLE_ID: cn.gcli.quota-watch
    steps:
      - uses: actions/checkout@v7
        with:
            ref: ${{ needs.extract-version.outputs.tag }}
            submodules: true
      - name: Update Rust
        run: |
          rustup update
          rustc --version
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-macos-
      - name: Install target for MacOS
        run: |
          for arch in x86_64 aarch64; do
            rustup target add $arch-apple-darwin
          done
      - name: Build for MacOS
        run: |
          for arch in x86_64 aarch64; do
            cargo build -p quota-watch --release --target $arch-apple-darwin
          done
          # 合并为单个 Universal Binary（供 .app 打包使用）
          lipo -create \
            target/aarch64-apple-darwin/release/quota-watch \
            target/x86_64-apple-darwin/release/quota-watch \
            -output quota-watch
          lipo -info quota-watch

      - name: Assemble .app bundle
        run: |
          APP_DIR="${{ env.APP_NAME }}.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          cp quota-watch "$APP_DIR/Contents/MacOS/quota-watch"

          # PNG 生成 icns 图标
          ICONSET=quota-watch.iconset
          mkdir "$ICONSET"
          SRC=assets/icons/quota-watch-256.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/quota-watch.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>${{ env.APP_NAME }}</string>
            <key>CFBundleDisplayName</key>       <string>Quota Watch</string>
            <key>CFBundleIdentifier</key>        <string>${{ env.BUNDLE_ID }}</string>
            <key>CFBundleVersion</key>           <string>${{ needs.extract-version.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.extract-version.outputs.version }}</string>
            <key>CFBundleExecutable</key>        <string>quota-watch</string>
            <key>CFBundleIconFile</key>          <string>quota-watch</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>LSMinimumSystemVersion</key>    <string>10.15</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>NSHumanReadableCopyright</key>  <string>Apache-2.0</string>
          </dict>
          </plist>
          PLIST

      - name: Create release tarballs
        run: |
          mkdir -p "${{ env.RELEASE_DIR }}"
          VER="${{ needs.extract-version.outputs.version }}"
          for arch in x86_64 aarch64; do
            tar -cJf "${{ env.RELEASE_DIR }}/quota-watch-v${VER}-$arch-apple-darwin.tar.xz" -C target/$arch-apple-darwin/release quota-watch
          done
          # 未签名的 .app（Universal）；文件名不含 signed，作为未签名信号。
          # 不含 apple-darwin 与单 arch 关键词，不会被应用内自更新选中（见 src/update.rs）
          tar -cJf "${{ env.RELEASE_DIR }}/quota-watch-v${VER}-universal.app.tar.xz" "${{ env.APP_NAME }}.app"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: ${{ env.RELEASE_DIR }}/*
          retention-days: 1

  build-windows:
    needs: [extract-version]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
            ref: ${{ needs.extract-version.outputs.tag }}
            submodules: true
      - name: Update Rust
        run: |
          rustup update
          rustc --version
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-windows-
      - name: Install zip utility
        run: choco install zip -y
        shell: powershell
      - name: Install target for Windows
        shell: bash
        run: |
          for arch in x86_64 aarch64; do
            rustup target add $arch-pc-windows-msvc
          done
      - name: Build for Windows
        shell: bash
        run: |
          for arch in x86_64 aarch64; do
            cargo build -p quota-watch --release --target $arch-pc-windows-msvc
          done
      - name: Create release zip files
        shell: bash
        run: |
          mkdir "${{ env.RELEASE_DIR }}"
          for arch in x86_64 aarch64; do
            zip -j "${{ env.RELEASE_DIR }}/quota-watch-v${{ needs.extract-version.outputs.version }}-$arch-pc-windows-msvc.zip" target/$arch-pc-windows-msvc/release/quota-watch.exe
          done
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: ${{ env.RELEASE_DIR }}/*
          retention-days: 1

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-dist/
          pattern: packages-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd all-dist
          sha256sum -- * | sort -k2 > SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.extract-version.outputs.tag }}
          files: all-dist/*
          generate_release_notes: true
          # beta 版在 GitHub 上标记为 prerelease
          prerelease: ${{ contains(needs.extract-version.outputs.tag, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
