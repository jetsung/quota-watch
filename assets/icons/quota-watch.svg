<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- subtle inner glow ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#334155" stroke-width="10"/>

  <!-- progress arc (about 70%) -->
  <path d="M 128 40
           A 88 88 0 1 1 46 88"
        fill="none" stroke="url(#arc)" stroke-width="14"
        stroke-linecap="round"/>

  <!-- tick at arc end -->
  <circle cx="46" cy="88" r="10" fill="#e2e8f0"/>

  <!-- clock hands -->
  <line x1="128" y1="128" x2="128" y2="76" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <line x1="128" y1="128" x2="168" y2="148" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>

  <!-- center hub -->
  <circle cx="128" cy="128" r="12" fill="#e2e8f0"/>
  <circle cx="128" cy="128" r="5" fill="#0f172a"/>
</svg>
