<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="44" y1="204" x2="212" y2="52">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- circular track -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#334155" stroke-width="12"/>

  <!-- upper loop arc -->
  <path d="M 54.7 101.3 A 78 78 0 0 1 201.3 101.3"
        fill="none" stroke="url(#loop)" stroke-width="18" stroke-linecap="round"/>

  <!-- lower loop arc -->
  <path d="M 201.3 154.7 A 78 78 0 0 1 54.7 154.7"
        fill="none" stroke="url(#loop)" stroke-width="18" stroke-linecap="round"/>

  <!-- upper arrow head -->
  <path d="M 208.1 120.1 188.4 103.9 212.8 95.0 Z" fill="#e2e8f0"/>
  <!-- lower arrow head -->
  <path d="M 47.9 135.9 67.6 152.1 43.2 161.0 Z" fill="#e2e8f0"/>

  <!-- center dot -->
  <circle cx="128" cy="128" r="13" fill="#e2e8f0"/>
</svg>
