[package]
name = "quota-watch"
version = "0.2.0-beta.1"
edition = "2024"
description = "一款轻量的桌面配额倒计时提醒工具"
license = "Apache-2.0"
repository = "https://github.com/jetsung/quota-watch"
readme = "README.md"
keywords = ["quota", "desktop", "notification", "reminder", "tray"]
categories = ["gui"]

[dependencies]
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
notify-rust = "4.18.2"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
directories = "6.0.0"
anyhow = "1.0.104"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni", "muda-snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
quick-xml = "0.41"
rfd = "0.15"
chacha20poly1305 = "0.10"
base64 = "0.22"
tar = "0.4.46"
xz2 = "0.1.7"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
# 最小特性：仅覆盖 win32.rs 用到的窗口/控制台 API（最大化还原、标题栏拖动、--version 附加控制台）
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
x11rb = "0.14.0"
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"

[target."cfg(windows)".dependencies]
zip = "9.0.5"

[package.metadata.deb]
maintainer = "Jetsung Chan <i@jetsung.com>"
# 维护脚本目录（postrm：卸载后清理 /opt/quota-watch 空目录，cargo-deb 自动 chmod 755）
maintainer-scripts = "assets/debian"
assets = [
    ["target/release/quota-watch", "opt/quota-watch/quota-watch", "755"],
    ["assets/linux/quota-watch.desktop", "usr/share/applications/quota-watch.desktop", "644"],
    ["assets/icons/quota-watch.svg", "usr/share/icons/hicolor/scalable/apps/quota-watch.svg", "644"],
    ["assets/icons/quota-watch-256.png", "usr/share/icons/hicolor/256x256/apps/quota-watch.png", "644"],
]

[package.metadata.generate-rpm]
maintainer = "Jetsung Chan <i@jetsung.com>"
assets = [
    { source = "target/release/quota-watch", dest = "/opt/quota-watch/quota-watch", mode = "755" },
    { source = "assets/linux/quota-watch.desktop", dest = "/usr/share/applications/quota-watch.desktop", mode = "644" },
    { source = "assets/icons/quota-watch.svg", dest = "/usr/share/icons/hicolor/scalable/apps/quota-watch.svg", mode = "644" },
    { source = "assets/icons/quota-watch-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/quota-watch.png", mode = "644" },
]
# rpm 只删除包属文件、不删目录，卸载后 /opt/quota-watch 会残留为空目录。
# 完全移除时（$1=0）用 rmdir 清理（rmdir 仅删空目录，升级 $1>=1 时不动，安全）。
post_uninstall_script = """
if [ "$1" -eq 0 ]; then
    rmdir /opt/quota-watch 2>/dev/null || true
fi
"""
