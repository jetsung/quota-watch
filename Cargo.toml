[package]
name = "quota-watch"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
notify-rust = "4.18.2"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
directories = "6.0.0"
anyhow = "1.0.104"
